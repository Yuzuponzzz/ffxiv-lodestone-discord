name: FFXIV Lodestone News

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Discordへテスト投稿する"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Send Discord test message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = os.environ["DISCORD_WEBHOOK_URL"]

          r = requests.post(
              url,
              json={
                  "content": "🧪 **FFXIV公式ニュース 動作テスト**\nDiscord Webhookへの接続に成功しました。",
                  "username": "FFXIV公式ニュース",
              },
              timeout=20,
          )

          r.raise_for_status()
          print("Discord test message sent successfully.")
          PY

      - name: Run Lodestone checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python lodestone.py

      - name: Save news history
        run: |
          if [ -f seen.json ]; then
            git config user.name "FFXIV Lodestone Bot"
            git config user.email "actions@github.com"
            git add seen.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Lodestone news history"
              git push
            fi
          fi
